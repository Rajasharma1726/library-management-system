<!DOCTYPE html>
<html lang="en">

<head>

    <!-- 
        Add Book Page

        This page allows the librarian/admin to add
        a new book into the library database.
     -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Book</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        /* 
           Page Background
           Gives a professional gradient background
         */

        body{
            background:linear-gradient(135deg,#0f172a,#1d4ed8,#3b82f6);
            font-family:'Poppins',sans-serif;
        }

        /* 
           Form Card
           Glassmorphism effect
         */

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.3);
        }

        /* 
           Heading
         */

        h2{
            font-weight:bold;
            color:#0f172a;
        }

        /* 
           Input Box
         */

        .form-control{
            border-radius:10px;
            height:45px;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,.3);
        }

        /* 
           Button
         */

        .btn-primary{
            background:#2563eb;
            border:none;
            border-radius:10px;
            height:45px;
            font-weight:bold;
        }

        .btn-primary:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<!-- 
     Main Container
 -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <!-- 
                 Book Entry Card
             -->

            <div class="card p-4">

                <h2 class="text-center mb-4">

                    <i class="fa-solid fa-book"></i>

                    Add New Book

                </h2>

                <!-- 
                     Book Form
                     Sends book data to Flask backend
                 -->

                <form action="/add_book" method="POST">

                    <!-- Book Name -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="fa-solid fa-book-open"></i>

                            Book Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="book_name"
                            placeholder="Enter Book Name"
                            required>

                    </div>

                    <!-- Author -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="fa-solid fa-user-pen"></i>

                            Author

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="author"
                            placeholder="Enter Author Name"
                            required>

                    </div>

                    <!-- Publication -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="fa-solid fa-building"></i>

                            Publication

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="publication"
                            placeholder="Publication Name">

                    </div>

                    <!-- Category -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="fa-solid fa-layer-group"></i>

                            Category

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="category"
                            placeholder="Programming / Science / Novel">

                    </div>

                    <!-- Quantity -->

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="fa-solid fa-boxes-stacked"></i>

                            Quantity

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="quantity"
                            min="1"
                            placeholder="Number of Books"
                            required>

                    </div>

                    <!-- Submit Button -->

                    <button class="btn btn-primary w-100">

                        <i class="fa-solid fa-plus"></i>

                        Add Book

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
